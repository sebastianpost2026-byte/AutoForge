name: Deploy AutoForge to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Normalize Mustang to correct real proportions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.index('function loadModel(){')
          end=s.index('loadModel();', start)
          block=s[start:end]
          old="car=g.scene;scene.add(car);const rawBox=new THREE.Box3().setFromObject(car);const rawSize=rawBox.getSize(new THREE.Vector3());if(rawSize.x>0)car.scale.x*=BASE.W/rawSize.x;"
          new="car=g.scene;scene.add(car);const rawBox=new THREE.Box3().setFromObject(car);const rawSize=rawBox.getSize(new THREE.Vector3());if(rawSize.x>0)car.scale.x*=BASE.L/rawSize.x;if(rawSize.y>0)car.scale.y*=BASE.H/rawSize.y;if(rawSize.z>0)car.scale.z*=BASE.W/rawSize.z;"
          block=block.replace(old,new)
          s=s[:start]+block+s[end:]
          s=s.replace("const BASE={L:4.31,W:1.88,H:1.27}","const BASE={L:4.31,W:1.88,H:1.27}")
          # Keep the initial workshop values synchronized with the normalized model.
          s=s.replace('value="1.93"','value="1.88"').replace('1.93 m','1.88 m')
          s=s.replace('value="4.50"','value="4.31"').replace('4.50 m','4.31 m')
          s=s.replace('value="1.33"','value="1.27"').replace('1.33 m','1.27 m')
          p.write_text(s)
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
