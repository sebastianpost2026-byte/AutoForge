name: Deploy AutoForge to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Fix parametric deformation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.index('function deform(){')
          end=s.index('function applyAll', start)
          new=r'''function deform(){
            if(!car)return;
            const wf=dims.W/2.02;
            const hf=dims.H/1.33;
            const ext=dims.L-4.50;
            const centerHalf=0.68;
            car.updateMatrixWorld(true);
            for(const r of records){
              const o=r.o;
              o.geometry=r.geo.clone();
              const pos=o.geometry.attributes.position;
              const arr=pos.array;
              const inv=new THREE.Matrix4().copy(o.matrixWorld).invert();
              const p=new THREE.Vector3();
              for(let i=0;i<arr.length;i+=3){
                p.set(arr[i],arr[i+1],arr[i+2]).applyMatrix4(o.matrixWorld);
                let z=p.z;
                if(ext!==0){
                  if(z>centerHalf) z+=ext/2;
                  else if(z<-centerHalf) z-=ext/2;
                  else z*=1+(ext/(2*centerHalf));
                }
                p.z=z;
                p.x*=wf;
                p.y*=hf;
                p.applyMatrix4(inv);
                arr[i]=p.x; arr[i+1]=p.y; arr[i+2]=p.z;
              }
              pos.needsUpdate=true;
              o.geometry.computeVertexNormals();
              o.geometry.computeBoundingBox();
              o.geometry.computeBoundingSphere();
            }
            for(const [o,b] of wheelBase){
              o.position.copy(b.p);
              o.scale.copy(b.s);
              o.position.x*=wf;
              const z=b.p.z;
              if(ext!==0) o.position.z=z>0?z+ext/2:z-ext/2;
            }
            car.updateMatrixWorld(true);
          }'''
          s=s[:start]+new+s[end:]
          s=s.replace("function isWheel(n){return /wheel|tire|tyre|rim|brake/.test(n)}","function isWheel(n){return !/steering/.test(n)&&/(?:wheel|tire|tyre|rim|brake)/.test(n)}")
          s=s.replace("const BASE={L:4.78,W:1.88,H:1.32}","const BASE={L:4.50,W:2.02,H:1.33}")
          s=s.replace('value="4.78"','value="4.50"').replace('4.78 m','4.50 m')
          s=s.replace('value="1.88"','value="2.02"').replace('1.88 m','2.02 m')
          s=s.replace('value="1.32"','value="1.33"').replace('1.32 m','1.33 m')
          p.write_text(s)
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
