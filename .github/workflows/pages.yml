name: Deploy AutoForge to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Install structural 3D deformation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=s.replace("const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});", "const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.localClippingEnabled=true;")
          start=s.index('function fit(o){')
          end=s.index('function loadModel', start)
          newfit=r'''function fit(o){const b=new THREE.Box3().setFromObject(o),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),scale=4.5/Math.max(s.x,s.y,s.z);o.position.sub(c);o.scale.multiplyScalar(scale);floor.position.y=-s.y*scale*.5;controls.target.set(0,0.58,0);camera.fov=39;camera.position.set(0,1.12,5.85);camera.updateProjectionMatrix();controls.update()}'''
          s=s[:start]+newfit+s[end:]
          start=s.index('function deform(){')
          end=s.index('function applyAll', start)
          newdeform=r'''function deform(){
            if(!car)return;
            const ext=dims.L-4.50;
            const localExt=ext/(car.scale.z||1);
            const a0=-0.95,b0=0.35,band=b0-a0,center=(a0+b0)/2;
            if(!window.afStruct){
              const root=new THREE.Group();scene.add(root);
              const data={root,front:null,center:null,rear:null,bodyMats:[],interiorMats:[]};
              function makeSegment(kind){
                const c=car.clone(true);
                c.position.copy(car.position);c.scale.copy(car.scale);
                const mats=[];
                c.traverse(o=>{
                  if(!o.isMesh)return;
                  const n=(o.name+' '+(o.material?.name||'')).toLowerCase();
                  if(isWheel(n)){o.visible=false;return;}
                  const list=Array.isArray(o.material)?o.material.map(m=>m.clone()):[o.material.clone()];
                  o.material=Array.isArray(o.material)?list:list[0];
                  list.forEach(m=>{m.clippingPlanes=[];m.clipIntersection=false;m.needsUpdate=true;mats.push(m);if(isBody(n))data.bodyMats.push(m);if(isInterior(n))data.interiorMats.push(m)});
                });
                c.userData.afMats=mats;
                root.add(c);return c;
              }
              data.front=makeSegment('front');data.center=makeSegment('center');data.rear=makeSegment('rear');
              car.traverse(o=>{if(o.isMesh){const n=(o.name+' '+(o.material?.name||'')).toLowerCase();if(!isWheel(n))o.visible=false;}});
              window.afStruct=data;
            }
            const A=window.afStruct;
            const baseScale=car.scale.clone();
            const f=1+localExt/band;
            const worldMin=car.position.z+a0*car.scale.z-localExt*car.scale.z/2;
            const worldMax=car.position.z+b0*car.scale.z+localExt*car.scale.z/2;
            const rearCut=new THREE.Plane(new THREE.Vector3(0,0,1),-worldMin);
            const frontCut=new THREE.Plane(new THREE.Vector3(0,0,-1),worldMax);
            const centerPlanes=[new THREE.Plane(new THREE.Vector3(0,0,1),-worldMax),new THREE.Plane(new THREE.Vector3(0,0,-1),worldMin)];
            function planesFor(kind){if(kind==='front')return [frontCut];if(kind==='rear')return [rearCut];return centerPlanes}
            for(const kind of ['front','center','rear']){
              const c=A[kind];
              c.position.copy(car.position);
              c.scale.copy(baseScale);
              if(kind==='front')c.position.z+=ext/2;
              if(kind==='rear')c.position.z-=ext/2;
              if(kind==='center'){
                c.scale.z=baseScale.z*f;
                c.position.z=car.position.z+center*baseScale.z*(1-f);
              }
              c.traverse(o=>{if(o.isMesh){const pp=planesFor(kind);const list=Array.isArray(o.material)?o.material:[o.material];list.forEach(m=>m.clippingPlanes=pp)}});
            }
            for(const [o,b] of wheelBase){o.position.copy(b.p);o.scale.copy(b.s);if(Math.abs(localExt)>0.0001)o.position.z=b.p.z>0?b.p.z+localExt/2:b.p.z-localExt/2;}
            car.updateMatrixWorld(true);
          }'''
          s=s[:start]+newdeform+s[end:]
          s=s.replace("window.paint=h=>bodyM.forEach(m=>m.color?.setHex(h));", "window.paint=h=>{bodyM.forEach(m=>m.color?.setHex(h));window.afStruct?.bodyMats?.forEach(m=>m.color?.setHex(h))};")
          s=s.replace("window.rough=x=>bodyM.forEach(m=>m.roughness=x);", "window.rough=x=>{bodyM.forEach(m=>m.roughness=x);window.afStruct?.bodyMats?.forEach(m=>m.roughness=x)};")
          s=s.replace("window.interiorColor=h=>interiorM.forEach(m=>m.color?.setHex(h));", "window.interiorColor=h=>{interiorM.forEach(m=>m.color?.setHex(h));window.afStruct?.interiorMats?.forEach(m=>m.color?.setHex(h))};")
          p.write_text(s)
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
