name: Deploy AutoForge to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preserve original Mustang proportions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.index('function fit(o){')
          end=s.index('function loadModel', start)
          newfit=r'''function fit(o){const b=new THREE.Box3().setFromObject(o),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());o.position.sub(c);window.afBaseBounds=new THREE.Box3().setFromObject(o);floor.position.y=-s.y/2;controls.target.set(0,0.58,0);camera.fov=40;const d=Math.max(5.6,s.z*1.35);camera.position.set(0,s.y*0.32,d);camera.updateProjectionMatrix();controls.update()}'''
          s=s[:start]+newfit+s[end:]
          # Do not deform the car during initial load. Editing only happens after a workshop control changes.
          s=s.replace('fit(car);saveRecords();applyAll();','fit(car);saveRecords();')
          s=s.replace("const BASE={L:4.50,W:2.02,H:1.33}","const BASE={L:4.31,W:1.93,H:1.27}")
          s=s.replace('value="4.50"','value="4.31"').replace('4.50 m','4.31 m')
          s=s.replace('value="2.02"','value="1.93"').replace('2.02 m','1.93 m')
          s=s.replace('value="1.33"','value="1.27"').replace('1.33 m','1.27 m')
          # Make deformation relative to the actual model base dimensions instead of the old hard-coded values.
          s=s.replace('const ext=dims.L-4.50;','const ext=dims.L-BASE.L;')
          s=s.replace("p.x*=dims.W/2.02;","p.x*=dims.W/BASE.W;")
          s=s.replace("p.y*=dims.H/1.33;","p.y*=dims.H/BASE.H;")
          p.write_text(s)
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
