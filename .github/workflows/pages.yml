name: Deploy AutoForge to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Improve interior camera
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="window.cam=t=>{const b=new THREE.Box3().setFromObject(car),c=b.getCenter(new THREE.Vector3()),z=b.getSize(new THREE.Vector3());if(t==='front')camera.position.set(0,c.y,z.z*1.4);if(t==='rear')camera.position.set(0,c.y,-z.z*1.4);if(t==='side')camera.position.set(z.x*1.5,c.y,0);if(t==='top')camera.position.set(0,c.y+z.y*2,0);if(t==='inside')camera.position.set(0,c.y+0.35,0.2);controls.target.copy(c);controls.update()};"
          new="window.cam=t=>{if(!car)return;const b=new THREE.Box3().setFromObject(car),c=b.getCenter(new THREE.Vector3()),z=b.getSize(new THREE.Vector3());if(t==='front'){camera.position.set(c.x,c.y,z.z*1.45);controls.target.set(c.x,c.y,c.z)}if(t==='rear'){camera.position.set(c.x,c.y,-z.z*1.45);controls.target.set(c.x,c.y,c.z)}if(t==='side'){camera.position.set(z.x*1.55,c.y,c.z);controls.target.copy(c)}if(t==='top'){camera.position.set(c.x,c.y+z.y*2.2,c.z);controls.target.copy(c)}if(t==='inside'){const h=c.y+0.48;camera.position.set(c.x,h,c.z+0.10);controls.target.set(c.x,h-0.04,c.z-1.15);controls.minDistance=.08;controls.maxDistance=8;controls.enablePan=true;controls.update()}else{controls.minDistance=.5;controls.maxDistance=40;controls.enablePan=false;controls.update()}};"
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
