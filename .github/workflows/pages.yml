name: Deploy AutoForge to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Correct initial Mustang width
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.index('function loadModel(){')
          end=s.index('loadModel();', start)
          block=s[start:end]
          block=block.replace("car=g.scene;scene.add(car);", "car=g.scene;scene.add(car);const rawBox=new THREE.Box3().setFromObject(car);const rawSize=rawBox.getSize(new THREE.Vector3());if(rawSize.x>0)car.scale.x*=BASE.W/rawSize.x;")
          s=s[:start]+block+s[end:]
          s=s.replace("const BASE={L:4.31,W:1.93,H:1.27}","const BASE={L:4.31,W:1.88,H:1.27}")
          s=s.replace('value="1.93"','value="1.88"').replace('1.93 m','1.88 m')
          s=s.replace("function fit(o){const b=new THREE.Box3().setFromObject(o),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());o.position.sub(c);window.afBaseBounds=new THREE.Box3().setFromObject(o);floor.position.y=-s.y/2;controls.target.set(0,0.58,0);camera.fov=40;const d=Math.max(5.6,s.z*1.35);camera.position.set(0,s.y*0.32,d);camera.updateProjectionMatrix();controls.update()}","function fit(o){const b=new THREE.Box3().setFromObject(o),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());o.position.sub(c);window.afBaseBounds=new THREE.Box3().setFromObject(o);floor.position.y=-s.y/2;controls.target.set(0,0.54,0);camera.fov=40;const d=Math.max(5.8,s.z*1.38);camera.position.set(0,s.y*0.30,d);camera.updateProjectionMatrix();controls.update()}")
          p.write_text(s)
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
