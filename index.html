<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AutoForge · 3D Automotive Studio</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#05080d;color:#eef5ff;font-family:Inter,system-ui,Arial}.app{height:100%;display:grid;grid-template-columns:205px 1fr 290px}.side{padding:14px;background:#070b12;border-right:1px solid #1d2a39}.right{border-left:1px solid #1d2a39;overflow:auto}.side button,.right button{width:100%;padding:11px;margin:4px 0;border:1px solid #223246;background:#0b1420;color:#cbd8e8;border-radius:9px;text-align:left}.side button:hover,.side .on{border-color:#1687f5;color:white;background:#0d2034}.stage{position:relative;min-width:0}#v{width:100%;height:100%}.header{position:fixed;z-index:10;left:0;right:0;top:0;height:62px;padding:0 18px;display:flex;align-items:center;background:#070c14ee;border-bottom:1px solid #233246}.logo{font-size:24px;font-weight:800}.logo b{color:#2998ff}.tag{margin-left:15px;color:#7f91a8;font-size:12px}.title{position:absolute;left:18px;top:80px;z-index:2}.title h1{margin:0;font-size:18px}.title small{color:#71839a}.cams{position:absolute;bottom:18px;left:18px;right:18px;display:flex;gap:7px;flex-wrap:wrap;z-index:2}.cams button{width:auto;background:#08111cdd;border:1px solid #293b51;color:#d9e7f8;padding:9px 12px;border-radius:9px}.box{margin:12px;background:#09121c;border:1px solid #203145;border-radius:12px;padding:12px}.box h3{font-size:13px;margin:0 0 10px}.sw{display:flex;gap:7px;flex-wrap:wrap}.sw i{width:29px;height:29px;border-radius:50%;border:2px solid #405269;cursor:pointer}.row{display:flex;gap:6px}.row button{flex:1;text-align:center}.ai textarea{width:100%;height:82px;resize:none;background:#050a10;border:1px solid #26374a;border-radius:8px;color:white;padding:8px}.ai .go{background:#1687f5;border:0;text-align:center;color:white;font-weight:700}.spec{display:grid;grid-template-columns:1fr 1fr;gap:6px}.spec div{padding:8px;background:#07101a;border:1px solid #1a2a3b;border-radius:8px;font-size:12px}.spec small{display:block;color:#687b92}.loading{position:fixed;z-index:50;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#05080df5}.loading.hide{opacity:0;pointer-events:none;transition:.4s}.bar{width:260px;height:5px;background:#162232;border-radius:5px;margin-top:15px;overflow:hidden}.fill{height:100%;width:0;background:#1687f5;transition:.25s}.status{margin-top:10px;color:#8da0b7;font-size:13px}@media(max-width:850px){.app{grid-template-columns:58px 1fr}.side{padding:7px}.side button{font-size:0;text-align:center}.side button:first-letter{font-size:17px}.right{position:fixed;z-index:20;right:0;top:62px;width:285px;height:calc(100% - 62px);transform:translateX(100%);transition:.2s}.right.open{transform:none}.tag{display:none}.title{top:76px}.header{height:62px}}</style></head><body><div class="loading" id="loading"><div style="font-size:25px;font-weight:800">Auto<span style="color:#2998ff">Forge</span></div><div style="margin-top:8px">Cargando vehículo 3D real…</div><div class="bar"><div class="fill" id="fill"></div></div><div class="status" id="status">0%</div></div><header class="header"><div class="logo">Auto<b>Forge</b></div><div class="tag">3D Automotive Studio · modelo GLB real</div></header><div class="app"><aside class="side"><button class="on">🚗 Exterior</button><button onclick="togglePanel()">💺 Interior</button><button>⚙️ Taller</button><button>🤖 IA</button><hr style="border-color:#172434"><button onclick="cam('front')">◉ Frontal</button><button onclick="cam('rear')">◉ Trasera</button><button onclick="cam('side')">◉ Lateral</button><button onclick="cam('top')">◉ Superior</button><button onclick="rotate()">↻ 360°</button></aside><main class="stage"><div class="title"><h1>Car Concept · 3D Studio</h1><small>Modelo automotriz GLB · AutoForge</small></div><div id="v"></div><div class="cams"><button onclick="cam('front')">Frontal</button><button onclick="cam('rear')">Trasera</button><button onclick="cam('side')">Lateral</button><button onclick="cam('top')">Superior</button><button onclick="rotate()">360°</button><button onclick="shot()">📸 Capturar</button></div></main><aside class="right" id="panel"><div class="box"><h3>PINTURA</h3><div class="sw"><i style="background:#111" onclick="paint(0x111318)"></i><i style="background:#e5e8ed" onclick="paint(0xe5e8ed)"></i><i style="background:#b31325" onclick="paint(0xb31325)"></i><i style="background:#0b4b91" onclick="paint(0x0b4b91)"></i><i style="background:#555" onclick="paint(0x555555)"></i></div></div><div class="box"><h3>ACABADO</h3><div class="row"><button onclick="rough(.2)">Brillo</button><button onclick="rough(.72)">Mate</button></div></div><div class="box"><h3>RINES</h3><div class="row"><button onclick="wheels(1)">20”</button><button onclick="wheels(1.12)">22”</button><button onclick="wheels(1.22)">24”</button></div></div><div class="box"><h3>ESPECIFICACIONES</h3><div class="spec"><div><small>Modelo</small>Car Concept</div><div><small>Formato</small>GLB / glTF 2.0</div><div><small>Render</small>WebGL / Three.js</div><div><small>Control</small>Touch / Mouse</div></div></div><div class="box ai"><h3>🤖 AI ASSISTANT</h3><textarea id="p" placeholder="Ej.: hazlo rojo mate, rines 22..."></textarea><button class="go" onclick="ai()">Aplicar diseño</button></div></aside></div><script type="module">import*as THREE from'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';import{OrbitControls}from'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';import{GLTFLoader}from'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';const el=document.querySelector('#v'),scene=new THREE.Scene();scene.background=new THREE.Color(0x05080d);const camera=new THREE.PerspectiveCamera(42,el.clientWidth/el.clientHeight,.01,1000);camera.position.set(5,2.4,7);const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(el.clientWidth,el.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;el.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=.5;controls.maxDistance=40;controls.target.set(0,1,0);scene.add(new THREE.HemisphereLight(0xcfe2ff,0x101622,2.2));const key=new THREE.DirectionalLight(0xffffff,3.2);key.position.set(5,8,6);scene.add(key);const rim=new THREE.DirectionalLight(0x1687ff,2.4);rim.position.set(-5,4,-6);scene.add(rim);const floor=new THREE.Mesh(new THREE.CircleGeometry(20,64),new THREE.MeshStandardMaterial({color:0x080d14,roughness:.82}));floor.rotation.x=-Math.PI/2;scene.add(floor);let car=null,bodyMaterials=[],wheelNodes=[],baseWheelScale=new Map();const MODEL='https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CarConcept/GLB/CarConcept.glb';const loading=document.querySelector('#loading'),fill=document.querySelector('#fill'),status=document.querySelector('#status');new GLTFLoader().load(MODEL,g=>{car=g.scene;scene.add(car);car.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;const n=(o.name+' '+(o.material?.name||'')).toLowerCase();if(/body|paint|carpaint|exterior/.test(n)&&o.material?.color){bodyMaterials.push(o.material)}if(/wheel|tire|tyre|rim/.test(n)){wheelNodes.push(o);baseWheelScale.set(o,o.scale.clone())}}});const box=new THREE.Box3().setFromObject(car),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());car.position.sub(center);const max=Math.max(size.x,size.y,size.z);car.scale.multiplyScalar(4.5/max);floor.position.y=-size.y*.5*(4.5/max);controls.target.set(0,0,0);camera.position.set(0,Math.max(1.5,size.y*2),Math.max(4,size.z*2.2));controls.update();loading.classList.add('hide');},xhr=>{const p=xhr.total?xhr.loaded/xhr.total*100:0;fill.style.width=p+'%';status.textContent=Math.round(p)+'%'},e=>{status.textContent='No se pudo cargar el modelo 3D';status.style.color='#ff6b6b';});window.cam=v=>{const d=6;if(v==='front')camera.position.set(0,2,d);if(v==='rear')camera.position.set(0,2,-d);if(v==='side')camera.position.set(d,1.8,0);if(v==='top')camera.position.set(0,d,0);controls.target.set(0,0,0);controls.update()};window.rotate=()=>controls.autoRotate=!controls.autoRotate;window.paint=h=>bodyMaterials.forEach(m=>{if(m.color)m.color.setHex(h)});window.rough=x=>bodyMaterials.forEach(m=>m.roughness=x);window.wheels=x=>wheelNodes.forEach(n=>{const b=baseWheelScale.get(n);n.scale.set(b.x*x,b.y*x,b.z*x)});window.shot=()=>{const a=document.createElement('a');a.download='autoforge.png';a.href=renderer.domElement.toDataURL('image/png');a.click()};window.ai=()=>{const t=document.querySelector('#p').value.toLowerCase();if(t.includes('rojo'))paint(0xb31325);if(t.includes('azul'))paint(0x0b4b91);if(t.includes('blanco'))paint(0xe5e8ed);if(t.includes('gris'))paint(0x777777);if(t.includes('negro'))paint(0x111318);if(t.includes('mate'))rough(.72);if(t.includes('brillo'))rough(.2);if(t.includes('22'))wheels(1.12);if(t.includes('24'))wheels(1.22)};window.togglePanel=()=>document.querySelector('#panel').classList.toggle('open');addEventListener('resize',()=>{camera.aspect=el.clientWidth/el.clientHeight;camera.updateProjectionMatrix();renderer.setSize(el.clientWidth,el.clientHeight)});(function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)})();</script></body></html>
