<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoForge · 3D Automotive Studio</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#05080d;color:#eef5ff;font-family:system-ui,Arial}.app{height:100%;display:grid;grid-template-columns:190px 1fr 285px}.header{position:fixed;z-index:5;top:0;left:0;right:0;height:60px;padding:0 18px;display:flex;align-items:center;background:#070c14ee;border-bottom:1px solid #233246}.logo{font-size:24px;font-weight:800}.logo b{color:#2998ff}.tag{margin-left:15px;color:#7f91a8;font-size:12px}.side{padding:72px 10px 10px;background:#070b12;border-right:1px solid #1d2a39}.side button,.right button{width:100%;padding:10px;margin:4px 0;border:1px solid #223246;background:#0b1420;color:#cbd8e8;border-radius:9px;cursor:pointer}.side .on,.side button:hover{border-color:#1687f5;color:white}.stage{position:relative;min-width:0;min-height:0}.stage #v{position:absolute;inset:0;width:100%;height:100%}.title{position:absolute;z-index:2;left:18px;top:78px}.title h1{margin:0;font-size:18px}.title small{color:#71839a}.cams{position:absolute;z-index:2;bottom:18px;left:18px;right:18px;display:flex;gap:7px;flex-wrap:wrap}.cams button{width:auto}.right{padding-top:62px;border-left:1px solid #1d2a39;overflow:auto}.box{margin:10px;padding:11px;background:#09121c;border:1px solid #203145;border-radius:12px}.box h3{font-size:13px;margin:0 0 9px}.sw{display:flex;gap:7px}.sw i{width:29px;height:29px;border-radius:50%;border:2px solid #405269;cursor:pointer}.row{display:flex;gap:5px}.row button{flex:1}.ai textarea{width:100%;height:75px;background:#050a10;color:white;border:1px solid #26374a;border-radius:8px;padding:8px}.ai .go{background:#1687f5;color:white;border:0;font-weight:700}.status{line-height:1.5}.status small{color:#8092a8}.loading{display:none!important}@media(max-width:850px){.app{grid-template-columns:55px 1fr}.side{padding:68px 5px 5px}.side button{font-size:0;text-align:center}.side button:first-letter{font-size:17px}.right{position:fixed;z-index:4;right:0;top:0;padding-top:62px;width:280px;height:100%;transform:translateX(100%);transition:.2s;background:#070b12}.right.open{transform:none}.tag{display:none}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><header class="header"><div class="logo">Auto<b>Forge</b></div><div class="tag">3D Automotive Studio · carga rápida</div></header><div class="app"><aside class="side"><button class="on">🚗 Exterior</button><button onclick="togglePanel()">💺 Interior</button><button>⚙️ Taller</button><button>🤖 IA</button><hr><button onclick="cam('front')">◉ Frontal</button><button onclick="cam('rear')">◉ Trasera</button><button onclick="cam('side')">◉ Lateral</button><button onclick="cam('top')">◉ Superior</button><button onclick="rotate()">↻ 360°</button></aside><main class="stage"><div class="title"><h1>AutoForge · 3D Studio</h1><small>Modelo real cargando…</small></div><div id="v"></div><div class="cams"><button onclick="cam('front')">Frontal</button><button onclick="cam('rear')">Trasera</button><button onclick="cam('side')">Lateral</button><button onclick="cam('top')">Superior</button><button onclick="rotate()">360°</button><button onclick="shot()">📸 Capturar</button></div></main><aside class="right" id="panel"><div class="box"><h3>PINTURA</h3><div class="sw"><i style="background:#111" onclick="paint(0x111318)"></i><i style="background:#e5e8ed" onclick="paint(0xe5e8ed)"></i><i style="background:#b31325" onclick="paint(0xb31325)"></i><i style="background:#0b4b91" onclick="paint(0x0b4b91)"></i><i style="background:#555" onclick="paint(0x555555)"></i></div></div><div class="box"><h3>ACABADO</h3><div class="row"><button onclick="rough(.2)">Brillo</button><button onclick="rough(.72)">Mate</button></div></div><div class="box"><h3>RINES</h3><div class="row"><button onclick="wheels(1)">20”</button><button onclick="wheels(1.12)">22”</button><button onclick="wheels(1.22)">24”</button></div></div><div class="box status"><h3>ESTADO</h3><div id="state">📥 <b>Cargando Mustang GT…</b><br><small>El modelo 3D está dentro de AutoForge.</small></div></div><div class="box ai"><h3>🤖 AI ASSISTANT</h3><textarea id="p" placeholder="Ej.: hazlo rojo mate, rines 22..."></textarea><button class="go" onclick="ai()">Aplicar diseño</button></div></aside></div><script type="module">import*as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';const el=document.querySelector('#v'),state=document.querySelector('#state'),scene=new THREE.Scene();scene.background=new THREE.Color(0x05080d);let w=Math.max(1,el.clientWidth),h=Math.max(1,el.clientHeight);const camera=new THREE.PerspectiveCamera(42,w/h,.01,1000);const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1));renderer.setSize(w,h,false);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;el.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=.5;controls.maxDistance=40;scene.add(new THREE.HemisphereLight(0xcfe2ff,0x101622,2.2));const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(5,8,6);scene.add(key);const rim=new THREE.DirectionalLight(0x1687ff,2);rim.position.set(-5,4,-6);scene.add(rim);const floor=new THREE.Mesh(new THREE.CircleGeometry(20,40),new THREE.MeshStandardMaterial({color:0x080d14,roughness:.82}));floor.rotation.x=-Math.PI/2;floor.position.y=-1;scene.add(floor);let car=null,quickCar=null,bodyMaterials=[],wheelNodes=[],baseWheelScale=new Map();function fit(o){const b=new THREE.Box3().setFromObject(o),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),scale=4.5/Math.max(s.x,s.y,s.z);o.position.sub(c);o.scale.multiplyScalar(scale);floor.position.y=-s.y*scale*.5;controls.target.set(0,0,0);camera.position.set(0,2.1,6);controls.update()}function quickModel(){const g=new THREE.Group(),m=new THREE.MeshStandardMaterial({color:0x1687f5,metalness:.65,roughness:.22}),d=new THREE.MeshStandardMaterial({color:0x090b0e,metalness:.15,roughness:.3});const b=new THREE.Mesh(new THREE.BoxGeometry(3.8,.65,1.65),m);b.position.y=.72;g.add(b);const r=new THREE.Mesh(new THREE.BoxGeometry(2.05,.55,1.35),m);r.position.set(.15,1.2,0);g.add(r);for(const x of[-1.35,1.35])for(const z of[-.88,.88]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.22,20),d);wheel.rotation.x=Math.PI/2;wheel.position.set(x,.45,z);g.add(wheel)}scene.add(g);fit(g);return g}quickCar=quickModel();const MODEL='./2005_ford_mustang_gt.glb';new GLTFLoader().load(MODEL,g=>{if(quickCar){scene.remove(quickCar);quickCar.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){if(Array.isArray(o.material))o.material.forEach(m=>m.dispose());else o.material.dispose()}})}car=g.scene;scene.add(car);bodyMaterials=[];wheelNodes=[];baseWheelScale.clear();car.traverse(o=>{if(o.isMesh){const n=(o.name+' '+(o.material?.name||'')).toLowerCase();if(/body|paint|carpaint|exterior/.test(n)&&o.material?.color)bodyMaterials.push(o.material);if(/wheel|tire|tyre|rim/.test(n)){wheelNodes.push(o);baseWheelScale.set(o,o.scale.clone())}}});fit(car);state.innerHTML='🚗 <b>Modelo real listo</b><br><small>2005 Ford Mustang GT · Ricy · CC BY 4.0</small>';document.querySelector('.title small').textContent='Modelo real cargado · AutoForge'},xhr=>{if(xhr.total)state.innerHTML='📥 <b>Modelo real: '+Math.round(xhr.loaded/xhr.total*100)+'%</b><br><small>Descargando desde el repositorio de AutoForge…</small>';},()=>state.innerHTML='⚠️ <b>No se pudo cargar el modelo real.</b><br><small>Revisa que 2005_ford_mustang_gt.glb esté en la raíz del repositorio.</small>');window.cam=v=>{const d=6;if(v==='front')camera.position.set(0,2,d);if(v==='rear')camera.position.set(0,2,-d);if(v==='side')camera.position.set(d,1.8,0);if(v==='top')camera.position.set(0,d,0);controls.target.set(0,0,0);controls.update()};window.rotate=()=>controls.autoRotate=!controls.autoRotate;window.paint=h=>{bodyMaterials.forEach(m=>m.color?.setHex(h));if(quickCar)quickCar.traverse(o=>{if(o.isMesh&&o.material?.color)o.material.color.setHex(h)})};window.rough=x=>bodyMaterials.forEach(m=>m.roughness=x);window.wheels=x=>wheelNodes.forEach(n=>{const b=baseWheelScale.get(n);n.scale.set(b.x*x,b.y*x,b.z*x)});window.shot=()=>{const a=document.createElement('a');a.download='autoforge.png';a.href=renderer.domElement.toDataURL('image/png');a.click()};window.ai=()=>{const t=document.querySelector('#p').value.toLowerCase();if(t.includes('rojo'))paint(0xb31325);if(t.includes('azul'))paint(0x0b4b91);if(t.includes('blanco'))paint(0xe5e8ed);if(t.includes('gris'))paint(0x777777);if(t.includes('negro'))paint(0x111318);if(t.includes('mate'))rough(.72);if(t.includes('brillo'))rough(.2);if(t.includes('22'))wheels(1.12);if(t.includes('24'))wheels(1.22)};window.togglePanel=()=>document.querySelector('#panel').classList.toggle('open');addEventListener('resize',()=>{const w=Math.max(1,el.clientWidth),h=Math.max(1,el.clientHeight);camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)});(function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)})();</script></body></html>
