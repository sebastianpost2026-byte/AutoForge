<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoForge 3D</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#05080d;color:#eef5ff;font-family:Inter,system-ui,Arial}header{height:64px;border-bottom:1px solid #233246;display:flex;align-items:center;padding:0 18px;background:#070c14}.logo{font-size:24px;font-weight:800}.logo b{color:#2998ff}.tag{margin-left:15px;color:#7f91a8;font-size:12px}.app{height:calc(100% - 64px);display:grid;grid-template-columns:210px 1fr 290px}.side{padding:14px;background:#070b12;border-right:1px solid #1d2a39}.right{border-left:1px solid #1d2a39;overflow:auto}.side button,.right button{width:100%;padding:11px;margin:4px 0;border:1px solid #223246;background:#0b1420;color:#cbd8e8;border-radius:9px;text-align:left}.side button:hover,.side .on{border-color:#1687f5;color:white;background:#0d2034}.stage{position:relative;min-width:0}#v{width:100%;height:100%}.title{position:absolute;left:18px;top:16px;z-index:2}.title h1{margin:0;font-size:18px}.title small{color:#71839a}.cams{position:absolute;bottom:18px;left:18px;right:18px;display:flex;gap:7px;flex-wrap:wrap;z-index:2}.cams button{background:#08111cdd;border:1px solid #293b51;color:#d9e7f8;padding:9px 12px;border-radius:9px}.box{margin:12px;background:#09121c;border:1px solid #203145;border-radius:12px;padding:12px}.box h3{font-size:13px;margin:0 0 10px}.sw{display:flex;gap:7px;flex-wrap:wrap}.sw i{width:29px;height:29px;border-radius:50%;border:2px solid #405269;cursor:pointer}.row{display:flex;gap:6px}.row button{flex:1;text-align:center}.ai textarea{width:100%;height:82px;resize:none;background:#050a10;border:1px solid #26374a;border-radius:8px;color:white;padding:8px}.ai .go{background:#1687f5;border:0;text-align:center;color:white;font-weight:700}.spec{display:grid;grid-template-columns:1fr 1fr;gap:6px}.spec div{padding:8px;background:#07101a;border:1px s </style></head><body><header><div class="logo">Auto<b>Forge</b></div><div class="tag">3D Automotive Studio · versión web</div></header><div class="app"><aside class="side"><button class="on">🚗 Exterior</button><button>💺 Interior</button><button>⚙️ Performance</button><button>🤖 IA</button><hr style="border-color:#172434"><button onclick="cam('front')">◉ Frontal</button><button onclick="cam('rear')">◉ Trasera</button><button onclick="cam('side')">◉ Lateral</button><button onclick="rotate()">↻ 360°</button></aside><main class="stage"><div class="title"><h1>Mustang GT · 3D Studio</h1><small>Prototipo AutoForge</small></div><div id="v"></div><div class="cams"><button onclick="cam('front')">Frontal</button><button onclick="cam('rear')">Trasera</button><button onclick="cam('side')">Lateral</button><button onclick="cam('top')">Superior</button><button onclick="rotate()">360°</button><button onclick="shot()">📸 Capturar</button></div></main><aside class="right" id="panel"><div class="box"><h3>PINTURA</h3><div class="sw"><i style="background:#111" onclick="paint(0x111318)"></i><i style="background:#e5e8ed" onclick="paint(0xe5e8ed)"></i><i style="background:#b31325" onclick="paint(0xb31325)"></i><i style="background:#0b4b91" onclick="paint(0x0b4b91)"></i><i style="background:#555" onclick="paint(0x555555)"></i></div></div><div class="box"><h3>ACABADO</h3><div class="row"><button onclick="rough(.2)">Brillo</button><button onclick="rough(.72)">Mate</button></div></div><div class="box"><h3>RINES</h3><div class="row"><button onclick="wheels(1)">20”</button><button onclick="wheels(1.12)">22”</button><button onclick="wheels(1.22)">24”</button></div></div><div class="box"><h3>ESPECIFICACIONES</h3><div class="spec"><div><small>Tipo</small>Sports car</div><div><small>Motor</small>WebGL 3D</div><div><small>Controles</small>Touch/Mouse</div><div><small>Vista</small>360°</div></div></div><div class="box ai"><h3>🤖 AI ASSISTANT</h3><textarea id="p" placeholder="Ej.: hazlo rojo mate..."></textarea><button class="go" onclick="ai()">Aplicar diseño</button></div></aside></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';import{OrbitControls}from'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';const m=document.querySelector('#v'),s=new THREE.Scene();s.background=new THREE.Color(0x05080d);const c=new THREE.PerspectiveCamera(40,m.clientWidth/m.clientHeight,.1,100);c.position.set(5,2.4,7);const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(m.clientWidth,m.clientHeight);r.outputColorSpace=THREE.SRGBColorSpace;m.append(r.domElement);const o=new OrbitControls(c,r.domElement);o.enableDamping=true;o.target.set(0,1,0);s.add(new THREE.HemisphereLight(0xbfd7ff,0x111722,2));let key=new THREE.DirectionalLight(0xffffff,3);key.position.set(5,7,5);s.add(key);let rim=new THREE.DirectionalLight(0x1687ff,2);rim.position.set(-5,3,-5);s.add(rim);const car=new THREE.Group();s.add(car);let bodyMat=new THREE.MeshStandardMaterial({color:0x111318,metalness:.65,roughness:.2});function box(x,y,z,px,py,pz,mat=bodyMat){let q=new THREE.Mesh(new THREE.BoxGeometry(x,y,z),mat);q.position.set(px,py,pz);q.castShadow=true;car.add(q);return q}box(4.6,.65,1.85,0,1,0);box(3.3,.55,1.65,.15,1.52,0);let glass=new THREE.MeshStandardMaterial({color:0x14283c,metalness:.15,roughness:.08});box(2.7,.5,1.45,.15,1.87,0,glass);let wheelMat=new THREE.MeshStandardMaterial({color:0x090b0e,metalness:.85,roughness:.22});let wheels=[];for(let x of[-1.65,1.65])for(let z of[-.98,.98]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.48,.48,.28,32),wheelMat);w.rotation.x=Math.PI/2;w.position.set(x,.62,z);car.add(w);wheels.push(w)}box(4.9,.18,1.95,0,.55,0,new THREE.MeshStandardMaterial({color:0x080b10,metalness:.5,roughness:.4}));let red=new THREE.MeshStandardMaterial({color:0xb20f22,emissive:0x250006});for(let z of[-.68,.68])box(.18,.2,.25,2.28,1.05,z,red);let floor=new THREE.Mesh(new THREE.CircleGeometry(8,64),new THREE.MeshStandardMaterial({color:0x080d14,roughness:.8}));floor.rotation.x=-Math.PI/2;s.add(floor);function frame(p){c.position.set(...p);o.target.set(0,1,0);o.update()}window.cam=v=>{if(v==='front')frame([0,1.8,7]);if(v==='rear')frame([0,1.8,-7]);if(v==='side')frame([7,1.7,0]);if(v==='top')frame([0,8,0])};window.rotate=()=>o.autoRotate=!o.autoRotate;window.paint=h=>bodyMat.color.setHex(h);window.rough=x=>bodyMat.roughness=x;window.wheels=x=>wheels.forEach(w=>w.scale.setScalar(x));window.shot=()=>{let a=document.createElement('a');a.download='autoforge.png';a.href=r.domElement.toDataURL();a.click()};window.ai=()=>{let t=document.querySelector('#p').value.toLowerCase();if(t.includes('rojo'))paint(0xb31325);if(t.includes('azul'))paint(0x0b4b91);if(t.includes('blanco'))paint(0xe5e8ed);if(t.includes('gris'))paint(0x777777);if(t.includes('mate'))rough(.72);if(t.includes('brillo'))rough(.2);if(t.includes('22'))wheels(1.12);if(t.includes('24'))wheels(1.22)};addEventListener('resize',()=>{c.aspect=m.clientWidth/m.clientHeight;c.updateProjectionMatrix();r.setSize(m.clientWidth,m.clientHeight)});(function loop(){requestAnimationFrame(loop);o.update();r.render(s,c)})();</script></body></html>
